name: SVA isolated prelaunch checks
on:
  push:
    branches:
      - "prep/sva-*"
permissions:
  contents: read
jobs:
  sva-marketing-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run non-production SVA integrity checks
        run: node --test tests/sva-conversion-11-points.test.mjs
