name: Production Watch

on:
  # Align the hourly smoke test with Vercel's 00-minute crons, rather
  # than waking Neon separately at minute 17. Do not reduce check coverage.
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
  # Verify the live public site immediately after a successful production deployment.
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-watch
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && (github.event.deployment.production_environment == true || github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify monitoring safety contracts locally
        run: node --test tests/production-smoke.test.mjs
      - name: Verify production customer journey
        env:
          PGI_PRODUCTION_URL: https://audiotel-premium-pro.com
        run: node scripts/production-smoke.mjs
