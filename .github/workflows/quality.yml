name: Quality & Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pgi_test
          POSTGRES_USER: pgi_test
          POSTGRES_PASSWORD: pgi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgi_test -d pgi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repository
        run: npm run verify

      - name: Performance and resilience tool smoke
        env:
          PGI_BACKEND_MODE: simulator
          PGI_BACKEND_HOST: 127.0.0.1
          PGI_BACKEND_PORT: 18080
          PGI_PERF_TARGET: http://127.0.0.1:18080
          PGI_SYNTHETIC_TARGET: http://127.0.0.1:18080
          PGI_PERF_DURATION_SECONDS: 3
          PGI_PERF_CONCURRENCY: 1
          PGI_RATE_LIMIT_PER_MINUTE: 10000
          PGI_HEAVY_READ_RATE_LIMIT_PER_MINUTE: 5000
          PGI_WRITE_RATE_LIMIT_PER_MINUTE: 5000
          PGI_PERF_P95_MS: 1500
          PGI_PERF_ERROR_RATE: 0
          PGI_PERF_MAX_RPS: 100
        run: |
          node backend/server.mjs > /tmp/pgi-perf-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/ready >/dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18080/api/v1/ready >/dev/null
          npm run perf:load
          npm run perf:synthetic
          npm run resilience:drill


      - name: Compare CI-only simulator concurrency profiles
        env:
          PGI_BACKEND_MODE: simulator
          PGI_BACKEND_HOST: 127.0.0.1
          PGI_BACKEND_PORT: 18081
          PGI_PERF_TARGET: http://127.0.0.1:18081
          PGI_RATE_LIMIT_PER_MINUTE: 10000
          PGI_HEAVY_READ_RATE_LIMIT_PER_MINUTE: 5000
          PGI_WRITE_RATE_LIMIT_PER_MINUTE: 5000
          PGI_PERF_PATHS: /api/v1/health,/api/v1/ready
          PGI_PERF_P95_MS: 1500
          PGI_PERF_ERROR_RATE: 0
        run: |
          mkdir -p .ci-perf
          node backend/server.mjs > /tmp/pgi-ci-load-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/v1/ready >/dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18081/api/v1/ready >/dev/null
          PGI_PERF_SCENARIO=load PGI_PERF_DURATION_SECONDS=4 PGI_PERF_CONCURRENCY=12 PGI_PERF_MAX_RPS=30 node scripts/performance-load.mjs > .ci-perf/simulator-load.json
          PGI_PERF_SCENARIO=stress PGI_PERF_DURATION_SECONDS=5 PGI_PERF_CONCURRENCY=30 PGI_PERF_MAX_RPS=75 node scripts/performance-load.mjs > .ci-perf/simulator-stress.json
          PGI_PERF_SCENARIO=spike PGI_PERF_DURATION_SECONDS=4 PGI_PERF_CONCURRENCY=60 PGI_PERF_MAX_RPS=150 node scripts/performance-load.mjs > .ci-perf/simulator-spike.json

      - name: Validate PostgreSQL schema and smoke tests
        env:
          PGPASSWORD: pgi_test
        run: |
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$PWD/database:/sql:ro" postgres:16-alpine             psql -h 127.0.0.1 -U pgi_test -d pgi_test -v ON_ERROR_STOP=1 -f /sql/schema.sql
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$PWD/database:/sql:ro" postgres:16-alpine             psql -h 127.0.0.1 -U pgi_test -d pgi_test -v ON_ERROR_STOP=1 -f /sql/views.sql
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$PWD/database:/sql:ro" postgres:16-alpine             psql -h 127.0.0.1 -U pgi_test -d pgi_test -v ON_ERROR_STOP=1 -f /sql/smoke.sql

      - name: Run database migrations twice
        env:
          PGI_DATABASE_URL: postgresql://pgi_test:pgi_test@127.0.0.1:5432/pgi_test
          PGI_DATABASE_SSL: disable
        run: |
          node backend/migrate.mjs
          node backend/migrate.mjs

      - name: Validate dormant APP order migration on CI PostgreSQL only
        env:
          PGPASSWORD: pgi_test
        run: |
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$PWD/database:/sql:ro" postgres:16-alpine \
            psql -h 127.0.0.1 -U pgi_test -d pgi_test -v ON_ERROR_STOP=1 \
            -f /sql/prelaunch-not-applied/090_audiotel_platform_number_order_preparation.sql
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:16-alpine \
            psql -h 127.0.0.1 -U pgi_test -d pgi_test -Atc \
            "SELECT (to_regclass('public.app_number_order_intents') IS NOT NULL AND to_regclass('public.app_number_order_evidence_drafts') IS NOT NULL AND to_regclass('public.app_number_order_action_drafts') IS NOT NULL AND to_regclass('public.app_number_order_audit') IS NOT NULL AND to_regclass('public.app_accounting_reconciliation_drafts') IS NOT NULL)::text;" | grep -Eq '^(t|true)$'

      - name: Backup and restore drill
        env:
          PGPASSWORD: pgi_test
        run: |
          mkdir -p .ci-recovery
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$PWD/.ci-recovery:/work" postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U pgi_test -d pgi_test --format=custom --no-owner --no-acl -f /work/pgi.dump
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:16-alpine \
            createdb -h 127.0.0.1 -U pgi_test pgi_restore_test
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$PWD/.ci-recovery:/work:ro" postgres:16-alpine \
            pg_restore -h 127.0.0.1 -U pgi_test -d pgi_restore_test --exit-on-error --no-owner --no-acl /work/pgi.dump
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:16-alpine \
            psql -h 127.0.0.1 -U pgi_test -d pgi_restore_test -Atc "SELECT (to_regclass('public.calls') IS NOT NULL AND to_regclass('public.outbox_events') IS NOT NULL AND to_regclass('public.transactional_email_deliveries') IS NOT NULL)::text;" | grep -Eq '^(t|true)$'

      - name: PostgreSQL store integration
        env:
          PGI_TEST_DATABASE_URL: postgresql://pgi_test:pgi_test@127.0.0.1:5432/pgi_test
        run: |
          node --test tests/postgres.integration.test.mjs
          node --test tests/critical-journeys.postgres.integration.test.mjs
          node --test tests/finance-fencing.postgres.integration.test.mjs

      - name: Benchmark read-only PostgreSQL methods in isolated CI database
        env:
          PGI_TEST_DATABASE_URL: postgresql://pgi_test:pgi_test@127.0.0.1:5432/pgi_test
        run: |
          mkdir -p .ci-perf
          node scripts/performance-postgres-ci.mjs > .ci-perf/postgres.json

      - name: Summarize CI-only performance evidence
        if: always()
        run: |
          node --input-type=module - <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import fs from "node:fs";
          console.log("### Isolated CI performance comparison\n");
          console.log("| Environment | Scenario | Virtual users | RPS target cap | Requests | p95 (ms) | Errors |");
          console.log("|---|---|---:|---:|---:|---:|---:|");
          for(const file of ["simulator-load.json","simulator-stress.json","simulator-spike.json","postgres.json"]){
            const path=".ci-perf/"+file;
            if(!fs.existsSync(path))continue;
            const r=JSON.parse(fs.readFileSync(path,"utf8"));
            if(file!=="postgres.json"){
              console.log("| Simulator | "+r.run_type+" | "+r.virtual_users+" | "+r.details.max_rps+" | "+r.requests_total+" | "+r.p95_ms.toFixed(1)+" | "+r.errors_total+" |");
            }else for(const x of r.results){
              console.log("| CI PostgreSQL | "+x.scenario+" | "+x.virtual_users+" | "+x.max_rps+" | "+x.samples+" | "+x.p95_ms.toFixed(1)+" | "+x.errors+" |");
            }
          }
          console.log("\nSynthetic CI traffic and fixture, not a production-capacity guarantee.");
          NODE

      - name: Archive CI-only performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-performance-evidence
          path: .ci-perf/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true



